<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Bookmark Organizer — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body data-i18n-title="settingsTitle">
  <main class="page">
    <header class="header">
      <h1 data-i18n="settingsHeader">AI 书签整理助手 · 设置</h1>
      <p data-i18n="settingsDesc">配置 AI 模型接口、整理规则及本地快照备份。所有 API Key 仅存储在本地浏览器。</p>
    </header>

    <section class="card">
      <h2 data-i18n="optLangCard">界面与输出语言</h2>
      <div class="field">
        <label for="uiLanguage" data-i18n="optUiLangLabel">语言设置（界面与默认分类语言）</label>
        <select id="uiLanguage">
          <option value="auto" data-i18n="optLangAuto">跟随浏览器语言 (Auto)</option>
          <option value="zh_CN" data-i18n="optLangZh">简体中文</option>
          <option value="en" data-i18n="optLangEn">English</option>
        </select>
        <small data-i18n="optLangHint">切换语言后将自动更新界面文本；若未修改过默认目录名或提示词，也会同步切换为对应语言模板。</small>
      </div>
      <p id="langStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optAiCard">AI 模型配置</h2>
      <div class="field">
        <label for="provider" data-i18n="optProvider">AI 提供商</label>
        <select id="provider"></select>
      </div>
      <div class="field" id="baseUrlField">
        <label for="baseUrl" data-i18n="optBaseUrl">API Base URL</label>
        <input id="baseUrl" type="url" placeholder="https://api.deepseek.com/v1" />
        <small data-i18n="optBaseUrlHint">使用自定义中转域名时，保存或测试将按需请求该单个域名的网络访问权限。</small>
      </div>
      <div class="field" id="modelField">
        <label for="model" data-i18n="optModel">模型名称</label>
        <input id="model" type="text" placeholder="deepseek-chat" />
      </div>
      <div class="field" id="apiKeyField">
        <label for="apiKey" data-i18n="optApiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div class="actions">
        <button id="btnSaveAi" class="btn-primary" type="button" data-i18n="optBtnSaveAi">保存配置（按需授权域名）</button>
        <button id="btnTestAi" class="btn-secondary" type="button" data-i18n="optBtnTestAi">测试连接</button>
      </div>
      <p id="aiStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optRulesCard">整理规则与隐私</h2>
      <div class="grid-2">
        <div class="field">
          <label for="recentDays" data-i18n="optRecentDays">近期活跃天数窗口</label>
          <input id="recentDays" type="number" min="7" max="3650" />
        </div>
        <div class="field">
          <label for="batchSize" data-i18n="optBatchSize">AI 单批处理条数</label>
          <input id="batchSize" type="number" min="10" max="150" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="archiveFolderName" data-i18n="optArchiveName">历史归档文件夹名称</label>
          <input id="archiveFolderName" type="text" />
        </div>
        <div class="field">
          <label for="archiveLocation" data-i18n="optArchiveLoc">历史归档存放位置</label>
          <select id="archiveLocation">
            <option value="bar_end" data-i18n="optLocBarEnd">书签栏末尾</option>
            <option value="other" data-i18n="optLocOther">「其他书签」根目录下</option>
          </select>
        </div>
      </div>
      <div class="checks">
        <label><input id="includeRootLoose" type="checkbox" /> <span data-i18n="optIncludeRootLoose">始终整理书签栏根目录散落书签</span></label>
        <label><input id="includeArchived" type="checkbox" /> <span data-i18n="optIncludeArchived">包含「历史归档」目录内的书签（关闭时跳过已归档目录）</span></label>
        <label><input id="ignoreDateCutoff" type="checkbox" /> <span data-i18n="optIgnoreDate">忽略近期天数限制（全量书签交由 AI 重新分类）</span></label>
        <label><input id="extractFrequent" type="checkbox" /> <span data-i18n="optExtractFrequent">自动提取近期点击访问的书签到「常用」文件夹</span></label>
        <label><input id="deduplicateArchive" type="checkbox" /> <span data-i18n="optDeduplicate">自动清理完全重复的网址（保留最新）</span></label>
        <label><input id="removeEmptyFolders" type="checkbox" /> <span data-i18n="optRemoveEmpty">归档后自动移除空文件夹</span></label>
        <label><input id="stripQueryParams" type="checkbox" /> <span data-i18n="optStripQuery">发送给 AI 前自动剥离 URL 查询参数（保护隐私）</span></label>
      </div>
      <div class="grid-2" id="frequentConfigRow">
        <div class="field">
          <label for="frequentDays" data-i18n="optFrequentDays">「常用」最近访问天数</label>
          <input id="frequentDays" type="number" min="7" max="365" />
        </div>
        <div class="field">
          <label for="frequentMaxCount" data-i18n="optFrequentMax">「常用」最多提取条数</label>
          <input id="frequentMaxCount" type="number" min="3" max="30" />
        </div>
      </div>
      <div class="field">
        <label for="promptTemplate" data-i18n="optPromptTemplate">预设提示词模板（快速切换风格）</label>
        <select id="promptTemplate"></select>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="customPrompt" data-i18n="optCustomPrompt">自定义分类提示词（System Prompt）</label>
          <button id="btnResetPrompt" class="btn-link" type="button" data-i18n="optBtnResetPrompt">恢复默认提示词</button>
        </div>
        <textarea id="customPrompt" rows="8" data-i18n-placeholder="optPromptPlaceholder" placeholder="填写你的书签分类规则与文件夹偏好..."></textarea>
        <small data-i18n="optPromptHint">可按自己的习惯自由修改分类逻辑；JSON 输出格式校验由系统自动附带，无需手写 Schema。</small>
      </div>
      <div class="actions">
        <button id="btnSaveRules" class="btn-primary" type="button" data-i18n="optBtnSaveRules">保存规则设置</button>
      </div>
      <p id="rulesStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optSnapshotCard">本地快照与数据管理</h2>
      <p id="snapshotInfo" class="muted" data-i18n="optSnapshotChecking">正在检查快照...</p>
      <div class="actions">
        <button id="btnExportSnapshot" class="btn-secondary" type="button" data-i18n="optBtnExportSnap">导出上次快照 JSON</button>
        <button id="btnClearSnapshot" class="btn-danger" type="button" data-i18n="optBtnClearSnap">清除本地快照</button>
      </div>
      <p id="snapshotStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optAboutCard">关于与开源</h2>
      <p class="muted">
        <span data-i18n="optAboutText">本项目基于 MIT 协议开源，所有代码公开可审计：</span>
        <a href="https://github.com/huhichao/ai-bookmark-organizer" target="_blank" rel="noopener noreferrer" data-i18n="optLinkRepo">GitHub 仓库</a>
        ·
        <a href="https://github.com/huhichao/ai-bookmark-organizer/issues" target="_blank" rel="noopener noreferrer" data-i18n="optLinkIssues">问题反馈</a>
        ·
        <a href="https://github.com/huhichao/ai-bookmark-organizer/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer" data-i18n="optLinkPrivacy">隐私政策</a>
      </p>
    </section>

    <p id="statusMsg" class="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
