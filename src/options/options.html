<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 书签整理助手 — 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>AI 书签整理助手 · 设置</h1>
      <p>配置 AI 模型接口、整理规则及本地快照备份。所有 API Key 仅存储在本地浏览器。</p>
    </header>

    <section class="card">
      <h2>AI 模型配置</h2>
      <div class="field">
        <label for="provider">AI 提供商</label>
        <select id="provider"></select>
      </div>
      <div class="field" id="baseUrlField">
        <label for="baseUrl">API Base URL</label>
        <input id="baseUrl" type="url" placeholder="https://api.deepseek.com/v1" />
        <small>使用自定义中转域名时，保存或测试将按需请求该单个域名的网络访问权限。</small>
      </div>
      <div class="field" id="modelField">
        <label for="model">模型名称</label>
        <input id="model" type="text" placeholder="deepseek-chat" />
      </div>
      <div class="field" id="apiKeyField">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div class="actions">
        <button id="btnSaveAi" class="btn-primary" type="button">保存配置（按需授权域名）</button>
        <button id="btnTestAi" class="btn-secondary" type="button">测试连接</button>
      </div>
      <p id="aiStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>整理规则与隐私</h2>
      <div class="grid-2">
        <div class="field">
          <label for="recentDays">近期活跃天数窗口</label>
          <input id="recentDays" type="number" min="7" max="3650" />
        </div>
        <div class="field">
          <label for="batchSize">AI 单批处理条数</label>
          <input id="batchSize" type="number" min="10" max="150" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="archiveFolderName">历史归档文件夹名称</label>
          <input id="archiveFolderName" type="text" />
        </div>
        <div class="field">
          <label for="archiveLocation">历史归档存放位置</label>
          <select id="archiveLocation">
            <option value="bar_end">书签栏末尾</option>
            <option value="other">「其他书签」根目录下</option>
          </select>
        </div>
      </div>
      <div class="checks">
        <label><input id="includeRootLoose" type="checkbox" /> 始终整理书签栏根目录散落书签</label>
        <label><input id="includeArchived" type="checkbox" /> 包含「历史归档」目录内的书签（关闭时跳过已归档目录）</label>
        <label><input id="ignoreDateCutoff" type="checkbox" /> 忽略近期天数限制（全量书签交由 AI 重新分类）</label>
        <label><input id="extractFrequent" type="checkbox" /> 自动提取近期点击访问的书签到「常用」文件夹</label>
        <label><input id="deduplicateArchive" type="checkbox" /> 自动清理完全重复的网址（保留最新）</label>
        <label><input id="removeEmptyFolders" type="checkbox" /> 归档后自动移除空文件夹</label>
        <label><input id="stripQueryParams" type="checkbox" /> 发送给 AI 前自动剥离 URL 查询参数（保护隐私）</label>
      </div>
      <div class="grid-2" id="frequentConfigRow">
        <div class="field">
          <label for="frequentDays">「常用」最近访问天数</label>
          <input id="frequentDays" type="number" min="7" max="365" />
        </div>
        <div class="field">
          <label for="frequentMaxCount">「常用」最多提取条数</label>
          <input id="frequentMaxCount" type="number" min="3" max="30" />
        </div>
      </div>
      <div class="field">
        <label for="promptTemplate">预设提示词模板（快速切换风格）</label>
        <select id="promptTemplate"></select>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="customPrompt">自定义分类提示词（System Prompt）</label>
          <button id="btnResetPrompt" class="btn-link" type="button">恢复默认提示词</button>
        </div>
        <textarea id="customPrompt" rows="8" placeholder="填写你的书签分类规则与文件夹偏好..."></textarea>
        <small>可按自己的习惯自由修改分类逻辑；JSON 输出格式校验由系统自动附带，无需手写 Schema。</small>
      </div>
      <div class="actions">
        <button id="btnSaveRules" class="btn-primary" type="button">保存规则设置</button>
      </div>
      <p id="rulesStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>本地快照与数据管理</h2>
      <p id="snapshotInfo" class="muted">正在检查快照...</p>
      <div class="actions">
        <button id="btnExportSnapshot" class="btn-secondary" type="button">导出上次快照 JSON</button>
        <button id="btnClearSnapshot" class="btn-danger" type="button">清除本地快照</button>
      </div>
      <p id="snapshotStatusMsg" class="status-inline" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>关于与开源</h2>
      <p class="muted">
        本项目基于 MIT 协议开源，所有代码公开可审计：
        <a href="https://github.com/huhichao/ai-bookmark-organizer" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
        ·
        <a href="https://github.com/huhichao/ai-bookmark-organizer/issues" target="_blank" rel="noopener noreferrer">问题反馈</a>
        ·
        <a href="https://github.com/huhichao/ai-bookmark-organizer/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">隐私政策</a>
      </p>
    </section>

    <p id="statusMsg" class="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
